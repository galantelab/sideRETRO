<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330" font-family="Helvetica, Arial, sans-serif">
<defs></defs>
<text x="24" y="65" font-size="16.25" fill="#64748B" text-anchor="start" font-weight="bold">Retrocopy at +</text>
<rect x="150" y="48" width="150" height="24" rx="4" fill="#CBD5E1"/>
<text x="225" y="66.1375" font-size="16.25" fill="#1F2A37" text-anchor="middle">left flank</text>
<rect x="650" y="48" width="150" height="24" rx="4" fill="#CBD5E1"/>
<text x="725" y="66.1375" font-size="16.25" fill="#1F2A37" text-anchor="middle">right flank</text>
<rect x="300" y="48" width="280" height="24" rx="0" fill="#CDE7F0" stroke="#2B7A9B" stroke-width="1.5"/>
<rect x="580" y="48" width="70" height="24" rx="0" fill="#1B5E7B" stroke="#2B7A9B" stroke-width="1.5"/>
<text x="440" y="66.1375" font-size="16.25" fill="#1F2A37" text-anchor="middle">5'   mRNA   3'</text>
<text x="615" y="66.05" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">AAAAA</text>
<rect x="560" y="84" width="90" height="12" rx="3" fill="#CDE7F0" stroke="#2B7A9B" stroke-width="1.2" stroke-dasharray="4,3"/>
<rect x="650" y="84" width="110" height="12" rx="3" fill="#64748B"/>
<text x="150" y="122" font-size="15" fill="#1F2A37" text-anchor="start">The clip at RBKP ends with a run of A: The tail is at the right junction</text>
<text x="24" y="195" font-size="16.25" fill="#64748B" text-anchor="start" font-weight="bold">Retrocopy at -</text>
<rect x="150" y="178" width="150" height="24" rx="4" fill="#CBD5E1"/>
<text x="225" y="196.137" font-size="16.25" fill="#1F2A37" text-anchor="middle">left flank</text>
<rect x="650" y="178" width="150" height="24" rx="4" fill="#CBD5E1"/>
<text x="725" y="196.137" font-size="16.25" fill="#1F2A37" text-anchor="middle">right flank</text>
<rect x="300" y="178" width="70" height="24" rx="0" fill="#1B5E7B" stroke="#2B7A9B" stroke-width="1.5"/>
<rect x="370" y="178" width="280" height="24" rx="0" fill="#CDE7F0" stroke="#2B7A9B" stroke-width="1.5"/>
<text x="335" y="196.05" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">TTTTT</text>
<text x="510" y="196.137" font-size="16.25" fill="#1F2A37" text-anchor="middle">3'   mRNA (reverse complement)   5'</text>
<rect x="190" y="214" width="110" height="12" rx="3" fill="#64748B"/>
<rect x="300" y="214" width="90" height="12" rx="3" fill="#CDE7F0" stroke="#2B7A9B" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="150" y="252" font-size="15" fill="#1F2A37" text-anchor="start">The clip at LBKP begins with a run of T: The tail is at the left junction</text>
<text x="150" y="290" font-size="15" fill="#64748B" text-anchor="start">A clip with other bases before the run gives the exact tail length; a clip made only of A (or T)</text>
<text x="150" y="309" font-size="15" fill="#64748B" text-anchor="start">gives a lower bound (POLYAMIN). Sequences are read at the forward strand of the reference, as in SAM.</text>
</svg>
