<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- Plus strand -->
  <text x="20" y="40" font-weight="bold">Retrocopy at +</text>
  <rect x="160" y="26" width="140" height="20" fill="#cfd8dc"/>
  <rect x="300" y="26" width="40" height="20" fill="#ffcc80"/>
  <rect x="340" y="26" width="220" height="20" fill="#a5d6a7"/>
  <rect x="560" y="26" width="60" height="20" fill="#81c784"/>
  <rect x="620" y="26" width="40" height="20" fill="#ffcc80"/>
  <rect x="660" y="26" width="140" height="20" fill="#cfd8dc"/>
  <text x="230" y="41" text-anchor="middle" font-size="12">left flank</text>
  <text x="450" y="41" text-anchor="middle" font-size="12">5'  mRNA  3'</text>
  <text x="590" y="41" text-anchor="middle" font-size="11">AAAAA</text>
  <text x="730" y="41" text-anchor="middle" font-size="12">right flank</text>
  <!-- read at the right junction -->
  <rect x="540" y="60" width="80" height="12" fill="#81c784" stroke="#2e7d32" stroke-dasharray="3,2"/>
  <rect x="620" y="60" width="110" height="12" fill="#546e7a"/>
  <text x="540" y="92" font-size="12" fill="#333">the clip at RBKP ends with a run of A: the tail is at the right junction</text>

  <!-- Minus strand -->
  <text x="20" y="160" font-weight="bold">Retrocopy at -</text>
  <rect x="160" y="146" width="140" height="20" fill="#cfd8dc"/>
  <rect x="300" y="146" width="40" height="20" fill="#ffcc80"/>
  <rect x="340" y="146" width="60" height="20" fill="#81c784"/>
  <rect x="400" y="146" width="220" height="20" fill="#a5d6a7"/>
  <rect x="620" y="146" width="40" height="20" fill="#ffcc80"/>
  <rect x="660" y="146" width="140" height="20" fill="#cfd8dc"/>
  <text x="230" y="161" text-anchor="middle" font-size="12">left flank</text>
  <text x="370" y="161" text-anchor="middle" font-size="11">TTTTT</text>
  <text x="510" y="161" text-anchor="middle" font-size="12">3'  mRNA (reverse complement)  5'</text>
  <text x="730" y="161" text-anchor="middle" font-size="12">right flank</text>
  <!-- read at the left junction -->
  <rect x="230" y="180" width="110" height="12" fill="#546e7a"/>
  <rect x="340" y="180" width="80" height="12" fill="#81c784" stroke="#2e7d32" stroke-dasharray="3,2"/>
  <text x="230" y="212" font-size="12" fill="#333">the clip at LBKP begins with a run of T: the tail is at the left junction</text>

  <text x="20" y="260" font-size="12" fill="#555">A read whose clip has other bases before the run gives the exact tail length; a clip made only of A (or T)</text>
  <text x="20" y="278" font-size="12" fill="#555">gives a lower bound (POLYAMIN). Sequences are always read at the forward strand of the reference, as in SAM.</text>
</svg>
