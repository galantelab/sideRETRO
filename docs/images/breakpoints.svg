<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Reference genome -->
  <text x="20" y="38" font-weight="bold">Reference</text>
  <rect x="120" y="24" width="300" height="20" fill="#cfd8dc"/>
  <rect x="420" y="24" width="60" height="20" fill="#ffcc80"/>
  <rect x="480" y="24" width="300" height="20" fill="#cfd8dc"/>
  <text x="250" y="39" text-anchor="middle">left flank</text>
  <text x="450" y="39" text-anchor="middle" font-size="12">TSD</text>
  <text x="630" y="39" text-anchor="middle">right flank</text>
  <line x1="479" y1="20" x2="479" y2="48" stroke="#d32f2f" stroke-width="2"/>
  <text x="479" y="64" text-anchor="middle" fill="#d32f2f" font-size="12">LBKP: last base of the left flank (after the TSD)</text>
  <line x1="421" y1="20" x2="421" y2="48" stroke="#1976d2" stroke-width="2"/>
  <text x="421" y="14" text-anchor="middle" fill="#1976d2" font-size="12">RBKP: first base of the right flank (the TSD start)</text>

  <!-- Sequenced genome -->
  <text x="20" y="128" font-weight="bold">Genome</text>
  <rect x="60" y="114" width="200" height="20" fill="#cfd8dc"/>
  <rect x="260" y="114" width="60" height="20" fill="#ffcc80"/>
  <rect x="320" y="114" width="200" height="20" fill="#a5d6a7"/>
  <rect x="520" y="114" width="40" height="20" fill="#81c784"/>
  <rect x="560" y="114" width="60" height="20" fill="#ffcc80"/>
  <rect x="620" y="114" width="180" height="20" fill="#cfd8dc"/>
  <text x="160" y="129" text-anchor="middle">left flank</text>
  <text x="290" y="129" text-anchor="middle" font-size="12">TSD</text>
  <text x="420" y="129" text-anchor="middle">retrocopy</text>
  <text x="540" y="129" text-anchor="middle" font-size="11">AAAA</text>
  <text x="590" y="129" text-anchor="middle" font-size="12">TSD</text>
  <text x="710" y="129" text-anchor="middle">right flank</text>

  <!-- Reads crossing the left junction: clipped at the right -->
  <g>
    <rect x="200" y="160" width="120" height="12" fill="#546e7a"/>
    <rect x="320" y="160" width="50" height="12" fill="#a5d6a7" stroke="#2e7d32" stroke-dasharray="3,2"/>
    <rect x="230" y="178" width="90" height="12" fill="#546e7a"/>
    <rect x="320" y="178" width="80" height="12" fill="#a5d6a7" stroke="#2e7d32" stroke-dasharray="3,2"/>
    <text x="200" y="210" font-size="12" fill="#333">reads from the left flank: aligned part ends at LBKP,</text>
    <text x="200" y="226" font-size="12" fill="#333">the clip (dashed) is the beginning of the insertion</text>
  </g>

  <!-- Reads crossing the right junction: clipped at the left -->
  <g>
    <rect x="490" y="160" width="70" height="12" fill="#a5d6a7" stroke="#2e7d32" stroke-dasharray="3,2"/>
    <rect x="560" y="160" width="120" height="12" fill="#546e7a"/>
    <rect x="520" y="178" width="40" height="12" fill="#a5d6a7" stroke="#2e7d32" stroke-dasharray="3,2"/>
    <rect x="560" y="178" width="90" height="12" fill="#546e7a"/>
    <text x="470" y="210" font-size="12" fill="#333">reads from the right flank: aligned part starts at RBKP,</text>
    <text x="470" y="226" font-size="12" fill="#333">the clip ends with the poly-A</text>
  </g>

  <!-- Legend -->
  <rect x="20" y="270" width="18" height="12" fill="#546e7a"/>
  <text x="46" y="281" font-size="12">aligned to the reference</text>
  <rect x="220" y="270" width="18" height="12" fill="#a5d6a7" stroke="#2e7d32" stroke-dasharray="3,2"/>
  <text x="246" y="281" font-size="12">soft clipped</text>
  <rect x="360" y="270" width="18" height="12" fill="#ffcc80"/>
  <text x="386" y="281" font-size="12">target site duplication (TSD = RBKP .. LBKP)</text>
  <text x="20" y="312" font-size="12" fill="#555">TSDLEN = LBKP - RBKP + 1. A clean insertion has LBKP = RBKP - 1 (TSDLEN = 0).</text>
</svg>
