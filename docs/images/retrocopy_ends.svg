<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Parental gene -->
  <text x="20" y="40" font-weight="bold">Parental gene</text>
  <line x1="160" y1="36" x2="800" y2="36" stroke="#90a4ae" stroke-width="2"/>
  <rect x="180" y="26" width="120" height="20" fill="#a5d6a7"/>
  <rect x="380" y="26" width="140" height="20" fill="#a5d6a7"/>
  <rect x="620" y="26" width="160" height="20" fill="#a5d6a7"/>
  <text x="240" y="41" text-anchor="middle" font-size="12">exon 1</text>
  <text x="450" y="41" text-anchor="middle" font-size="12">exon 2</text>
  <text x="700" y="41" text-anchor="middle" font-size="12">exon 3</text>
  <text x="340" y="22" text-anchor="middle" font-size="11" fill="#777">intron</text>
  <text x="570" y="22" text-anchor="middle" font-size="11" fill="#777">intron</text>

  <!-- 5' end: seed from the left junction clip -->
  <rect x="230" y="26" width="30" height="20" fill="none" stroke="#d32f2f" stroke-width="2"/>
  <text x="245" y="66" text-anchor="middle" fill="#d32f2f" font-size="12">PG5P</text>
  <!-- 3' end -->
  <rect x="750" y="26" width="30" height="20" fill="none" stroke="#1976d2" stroke-width="2"/>
  <text x="765" y="66" text-anchor="middle" fill="#1976d2" font-size="12">PG3P</text>

  <!-- Insertion site clips -->
  <text x="20" y="140" font-weight="bold">Insertion site</text>
  <rect x="160" y="126" width="100" height="20" fill="#cfd8dc"/>
  <rect x="260" y="126" width="70" height="20" fill="#a5d6a7" stroke="#2e7d32" stroke-dasharray="3,2"/>
  <text x="210" y="141" text-anchor="middle" font-size="12">left flank</text>
  <text x="295" y="141" text-anchor="middle" font-size="11">clip</text>
  <rect x="260" y="126" width="30" height="20" fill="none" stroke="#d32f2f" stroke-width="2"/>
  <path d="M275,124 C275,90 245,90 245,50" fill="none" stroke="#d32f2f" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="160" y="170" font-size="12" fill="#333">seed: the first 20 bases of the clips at LBKP</text>

  <rect x="500" y="126" width="80" height="20" fill="#a5d6a7" stroke="#2e7d32" stroke-dasharray="3,2"/>
  <rect x="580" y="126" width="40" height="20" fill="#81c784"/>
  <rect x="620" y="126" width="100" height="20" fill="#cfd8dc"/>
  <text x="540" y="141" text-anchor="middle" font-size="11">clip</text>
  <text x="600" y="141" text-anchor="middle" font-size="10">AAAA</text>
  <text x="670" y="141" text-anchor="middle" font-size="12">right flank</text>
  <rect x="550" y="126" width="30" height="20" fill="none" stroke="#1976d2" stroke-width="2"/>
  <path d="M565,124 C565,90 765,90 765,50" fill="none" stroke="#1976d2" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="460" y="170" font-size="12" fill="#333">seed: the last 20 bases before the poly-A of the clips at RBKP</text>

  <!-- Predicted sequence -->
  <text x="20" y="230" font-weight="bold">Predicted</text>
  <rect x="160" y="216" width="70" height="20" fill="#a5d6a7"/>
  <rect x="230" y="216" width="140" height="20" fill="#a5d6a7"/>
  <rect x="370" y="216" width="130" height="20" fill="#a5d6a7"/>
  <rect x="500" y="216" width="50" height="20" fill="#81c784"/>
  <line x1="230" y1="212" x2="230" y2="240" stroke="#fff" stroke-width="2"/>
  <line x1="370" y1="212" x2="370" y2="240" stroke="#fff" stroke-width="2"/>
  <text x="195" y="231" text-anchor="middle" font-size="11">exon 1'</text>
  <text x="300" y="231" text-anchor="middle" font-size="11">exon 2</text>
  <text x="435" y="231" text-anchor="middle" font-size="11">exon 3'</text>
  <text x="525" y="231" text-anchor="middle" font-size="10">poly-A</text>
  <text x="160" y="262" font-size="12" fill="#333">reference exon bases from PG5P to PG3P, spliced, in the mRNA sense, plus the observed poly-A (SVLEN)</text>

  <text x="20" y="310" font-size="12" fill="#555">The seeds are searched in both orientations. A forward match in a + gene (or a reverse one in a - gene) means the</text>
  <text x="20" y="328" font-size="12" fill="#555">insertion follows the mRNA sense at the reference, so the left junction is the 5' end; otherwise it is the 3' end.</text>
</svg>
